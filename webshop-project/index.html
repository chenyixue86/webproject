<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTrack — Seasonal Anime Guide</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-inner">
        <div class="nav-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <polygon points="5,3 19,12 5,21" fill="#7c6df8"/>
            </svg>
            <span class="logo-text">AniTrack</span>
        </div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="airing" onclick="switchTab(this, 'airing')">This Season</button>
            <button class="nav-tab" data-tab="upcoming" onclick="switchTab(this, 'upcoming')">Upcoming</button>
            <button class="nav-tab" data-tab="schedule" onclick="switchTab(this, 'schedule')">Schedule</button>
            <button class="nav-tab" data-tab="top" onclick="switchTab(this, 'top')">Top Anime</button>
            <button class="nav-tab" id="fav-tab" data-tab="favorites" onclick="switchTab(this, 'favorites')" style="display:none">
                Favorites
                <span class="fav-badge" id="fav-badge" style="display:none"></span>
            </button>
        </div>
        <div class="nav-right-group">
            <div class="notif-wrapper" id="notif-wrapper" style="display:none">
                <button class="notif-btn" id="notif-btn" onclick="toggleNotifDropdown()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="notif-badge" id="notif-badge" style="display:none"></span>
                </button>
                <div class="notif-dropdown" id="notif-dropdown">
                    <div class="notif-header">
                        <span>Notifications</span>
                        <button class="notif-mark-read" onclick="markEpisodesAsSeen()">Mark all read</button>
                    </div>
                    <div class="notif-list" id="notif-list"></div>
                </div>
            </div>
            <div class="nav-search">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" placeholder="Search..." id="search-input" oninput="handleSearch()" />
            </div>
            <button class="signin-btn" id="signin-btn" onclick="openAuthModal()">Sign In</button>
            <div class="nav-user" id="nav-user" style="display:none">
                <span class="nav-username" id="nav-username"></span>
                <button class="signout-btn" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<header class="page-header">
    <div class="page-header-inner">
        <div>
            <span class="season-badge" id="season-badge">Spring 2025</span>
            <h1 class="page-title" id="page-title">Currently Airing</h1>
        </div>
        <span class="anime-count" id="anime-count"></span>
    </div>
</header>

<!-- SORT BAR -->
<div class="sort-bar">
    <div class="sort-bar-inner">
        <span class="sort-label">Sort by</span>
        <button class="sort-btn active" onclick="setSort(this, 'score')">Score</button>
        <button class="sort-btn" onclick="setSort(this, 'date')">Date</button>
        <button class="sort-btn" onclick="setSort(this, 'episodes')">Episodes</button>
    </div>
</div>

<!-- MAIN -->
<main class="main">
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading anime...</p>
    </div>
    <div id="error-msg" class="error-msg" style="display:none">
        <p>Could not load anime. API may be rate limited, try again in a moment.</p>
        <button class="retry-btn" onclick="reload()">Retry</button>
    </div>
    <div id="anime-grid" class="anime-grid" style="display:none"></div>
</main>

<!-- ANIME MODAL -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="anime-modal" class="anime-modal">
    <div id="modal-content" class="modal-content"></div>
</div>

<!-- AUTH MODAL -->
<div id="auth-overlay" class="auth-overlay" onclick="closeAuthModal()"></div>
<div id="auth-modal" class="auth-modal">
    <button class="auth-close-btn" onclick="closeAuthModal()">✕</button>
    <div class="auth-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <polygon points="5,3 19,12 5,21" fill="#7c6df8"/>
        </svg>
        <span>AniTrack</span>
    </div>
    <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
    </div>

    <div id="form-login">
        <input id="login-email" type="email" placeholder="Email address" class="auth-input" />
        <input id="login-password" type="password" placeholder="Password" class="auth-input" />
        <p class="auth-error" id="login-error"></p>
        <button class="auth-submit-btn" onclick="login()">Sign In</button>
    </div>

    <div id="form-register" style="display:none">
        <input id="reg-username" type="text" placeholder="Username" class="auth-input" />
        <input id="reg-email" type="email" placeholder="Email address" class="auth-input" />
        <input id="reg-password" type="password" placeholder="Password" class="auth-input" />
        <p class="auth-error" id="register-error"></p>
        <button class="auth-submit-btn" onclick="register()">Create Account</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
